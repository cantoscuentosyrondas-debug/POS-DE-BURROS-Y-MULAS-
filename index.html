
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Burros & Mulas POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
          /* Valores por defecto que serán sobreescritos por JS */
          --neon-pink: #ff3399;
          --neon-blue: #33ccff;
          --neon-red: #ff0000;
          --neon-orange: #ff9900;
        }
        body { 
          font-family: 'Inter', sans-serif; 
          background-color: #000000;
          color: #ffffff;
          -webkit-tap-highlight-color: transparent;
          overscroll-behavior-y: contain;
        }
        .font-neon { font-family: 'Orbitron', sans-serif; }
        
        .neon-border-red { border: 3px solid var(--neon-red); box-shadow: 0 0 20px var(--neon-red), inset 0 0 10px var(--neon-red); }
        .neon-text-pink { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink); }
        .neon-text-blue { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue); }
        .neon-text-red { color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); }
        
        .custom-logo-container {
          position: relative;
          width: 280px;
          height: 280px;
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: 50%;
          border: 5px solid var(--neon-blue);
          box-shadow: 0 0 30px var(--neon-blue), inset 0 0 15px var(--neon-blue);
          background: #000;
          overflow: hidden;
          padding: 10px;
        }

        .logo-img {
          width: 100%;
          height: 100%;
          object-fit: contain;
          border-radius: 50%;
        }

        .logo-pulse {
          animation: pulse 4s infinite ease-in-out;
        }
        @keyframes pulse {
          0%, 100% { transform: scale(1); filter: brightness(1); }
          50% { transform: scale(1.02); filter: brightness(1.15); }
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Utility colors derived from dynamic variables */
        .bg-neon-blue { background-color: var(--neon-blue); }
        .bg-neon-pink { background-color: var(--neon-pink); }
        .border-neon-blue { border-color: var(--neon-blue); }
        .border-neon-pink { border-color: var(--neon-pink); }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body class="select-none">
    <div id="root"></div>
</body>
</html>
